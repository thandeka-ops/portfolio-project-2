global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "flask-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "flask-api:5000"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"