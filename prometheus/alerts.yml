groups:
  - name: project-2-alerts
    rules:

      - alert: FlaskAPIDown
        expr: up{job="flask-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Flask API is down"
          description: "The Flask API has been unavailable for more than 30 seconds."

      - alert: HighHTTPErrorRate
        expr: |
          (
            sum(rate(flask_http_request_total{status=~"5.."}[1m]))
            /
            sum(rate(flask_http_request_total[1m]))
          ) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of HTTP requests are returning 5xx errors."

      - alert: HighAPIResponseTime
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(flask_http_request_duration_seconds_bucket[5m])
            )
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API response time"
          description: "The 95th percentile API response time has exceeded 1 second."